name: Build and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stale_deployment_sha:
        description: "Optional stuck Pages deployment SHA to cancel before deploy"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let an accepted Pages deployment finish before publishing a newer commit.
  # Cancellation can leave the SHA-scoped Pages deployment stuck or cancelled.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build static site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
        run: npm exec astro build

      - name: Build Pagefind index
        run: npm exec pagefind -- --site dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Cancel explicitly identified stale deployment
        if: inputs.stale_deployment_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_DEPLOYMENT_SHA: ${{ inputs.stale_deployment_sha }}
        run: |
          if [[ ! "$STALE_DEPLOYMENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid stale deployment SHA."
            exit 1
          fi
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_DEPLOYMENT_SHA}"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
