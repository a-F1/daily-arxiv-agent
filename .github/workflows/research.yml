name: Daily arXiv research

on:
  schedule:
    # Idempotent checks cover EDT/EST, moderation delays, and Actions delays.
    - cron: "17 1 * * 1-5"
    - cron: "17 2 * * 1-5"
    - cron: "17 6 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Report date override (YYYY-MM-DD); blank uses the latest announcement"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-arxiv-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      CURSOR_CLAUDE_MODEL: ${{ vars.CURSOR_CLAUDE_MODEL }}
      CURSOR_OPENAI_MODEL: ${{ vars.CURSOR_OPENAI_MODEL }}
      CURSOR_SUMMARY_MODEL: ${{ vars.CURSOR_SUMMARY_MODEL || 'composer-2.5' }}
      CURSOR_IDEA_MODEL: ${{ vars.CURSOR_IDEA_MODEL || 'composer-2.5' }}
      OPENALEX_EMAIL: ${{ vars.OPENALEX_EMAIL }}
      MAX_DAILY_TOKENS: ${{ vars.MAX_DAILY_TOKENS || '10000000' }}
      MAX_DAILY_RUNS: ${{ vars.MAX_DAILY_RUNS || '180' }}
      MODEL_CONCURRENCY: ${{ vars.MODEL_CONCURRENCY || '3' }}
      DOMAIN_CONCURRENCY: ${{ vars.DOMAIN_CONCURRENCY || '3' }}
      SUMMARY_CONCURRENCY: ${{ vars.SUMMARY_CONCURRENCY || '3' }}
      MODEL_TIMEOUT_MS: ${{ vars.MODEL_TIMEOUT_MS || '600000' }}
      MAX_PAPER_TEXT_CHARS: ${{ vars.MAX_PAPER_TEXT_CHARS || '40000' }}
      DEBATE_MIN_ROUNDS: ${{ vars.DEBATE_MIN_ROUNDS || '3' }}
      DEBATE_MAX_ROUNDS: ${{ vars.DEBATE_MAX_ROUNDS || '3' }}
      TZ: America/New_York
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore resumable research checkpoints
        uses: actions/cache@v4
        with:
          path: data/checkpoints
          key: research-checkpoints-v2-${{ inputs.date || 'latest' }}-${{ github.run_id }}
          restore-keys: |
            research-checkpoints-v2-${{ inputs.date || 'latest' }}-

      - name: Validate pipeline
        run: npm run check && npm test

      - name: Generate research report
        env:
          REPORT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$REPORT_DATE" ]; then
            npm run research -- --date "$REPORT_DATE"
          else
            npm run research
          fi

      - name: Save research checkpoints
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/checkpoints
          key: research-checkpoints-v2-${{ inputs.date || 'latest' }}-${{ github.run_id }}

      - name: Commit report data
        run: |
          git add -- data/reports
          if git diff --cached --quiet; then
            echo "No new report data to commit."
            exit 0
          fi
          git config user.name "daily-arxiv[bot]"
          git config user.email "daily-arxiv[bot]@users.noreply.github.com"
          git commit -m "data: add daily arXiv report"
          git push
